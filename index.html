<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Automation Portal</title>

    <style>
        body {
            font-family: Segoe UI, Arial, sans-serif;
            background: #f1f5f9;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: auto;
        }

        .card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 2px 10px rgba(0,0,0,.1);
            margin-bottom: 20px;
            overflow: hidden;
        }

        .header {
            text-align: center;
            padding: 20px;
        }

        .header img {
            max-height: 150px;
            max-width: 100%;
        }

        .header h1 {
            color: #1e293b;
        }

        .button-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit,minmax(250px,1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .script-btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 16px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 16px;
        }

        .script-btn:hover {
            background: #1d4ed8;
        }

        .reports {
            padding: 20px;
        }

        .download-btn {
            background: #16a34a;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            border-bottom: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }

        .console {
            background: black;
            color: #00ff66;
            height: 400px;
            overflow-y: auto;
            padding: 15px;
            font-family: Consolas, monospace;
            border-radius: 12px;
        }

        .console-card {
            background: #0f172a;
            color: white;
            padding: 20px;
            border-radius: 16px;
        }

        .section-title {
            font-size: 20px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

<div class="container">

    <div class="card header">
        <img src="Cretex_Dam_Logo.jpg" alt="Cretex Logo">
        <h1>PowerShell Automation Portal</h1>
        <p>
            Azure Function front-end for PowerShell automation,
            report generation, and CSV downloads.
        </p>
    </div>

    <div class="button-grid">

        <button class="script-btn" onclick="runScript('UserAudit')">
            User Audit Report
        </button>

        <button class="script-btn" onclick="runScript('MailboxReport')">
            Mailbox Report
        </button>

        <button class="script-btn" onclick="runScript('LicenseReport')">
            License Report
        </button>

        <button class="script-btn" onclick="runScript('AllADMachines')">
            All AD Machines
        </button>

    </div>

    <div class="card reports">
        <div class="section-title">CSV Reports</div>

        <button class="download-btn">
            Download Latest CSV
        </button>

        <table>
            <thead>
                <tr>
                    <th>Report</th>
                    <th>Date<
